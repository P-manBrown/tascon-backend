name: PR report

# Writes the pr-report-* artifacts of the head commit of a pull request to the
# pull request as one comment, updated in place. It never checks out or runs
# the pull request code, and it is not a required check.
# A job in a listed workflow only uploads an artifact named
# pr-report-<two-digit order>-<content>. An artifact over 64 KiB is not shown.
# Add a workflow to `workflows` only when a new workflow uploads such artifacts.
# workflow_run runs the version of this file on the default branch only.
on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed

permissions:
  actions: read
  contents: read
  pull-requests: write

# The SHA keeps a late run of an older commit from replacing the pending run
# of the current head, as only one run can wait in a group.
concurrency:
  group: pr-report-${{ github.event.workflow_run.head_repository.full_name }}-${{ github.event.workflow_run.head_branch }}-${{ github.event.workflow_run.head_sha }}

defaults:
  run:
    shell: bash

jobs:
  comment:
    name: comment
    if: github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Write the reports to the pull request
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          marker='<!-- pr-report -->'

          # Skip runs whose commit is no longer the head of an open pull request.
          pr=$(gh api "repos/$REPO/commits/$HEAD_SHA/pulls" \
            --jq '[.[] | select(.state == "open" and .head.sha == env.HEAD_SHA) | .number] | first // empty')
          if [ -z "$pr" ]; then
            echo "No open pull request has $HEAD_SHA as its head."
            exit 0
          fi

          work="$RUNNER_TEMP/pr-report"
          mkdir -p "$work"

          # The newest unexpired artifact of each pr-report- name among the
          # pull_request runs of the head commit, sorted by name. Artifacts
          # over 64 KiB are skipped.
          gh api --paginate "repos/$REPO/actions/runs?head_sha=$HEAD_SHA&event=pull_request&per_page=100" \
            --jq '.workflow_runs[].id' > "$work/runs.txt"
          while read -r run_id; do
            gh api --paginate "repos/$REPO/actions/runs/$run_id/artifacts?per_page=100" \
              --jq '.artifacts[] | select((.name | startswith("pr-report-")) and (.expired | not) and .size_in_bytes <= 65536) | [.name, .created_at, .id] | @tsv'
          done < "$work/runs.txt" |
            sort -t $'\t' -k1,1 -k2,2r |
            awk -F '\t' '!seen[$1]++' > "$work/artifacts.tsv"
          if [ ! -s "$work/artifacts.tsv" ]; then
            echo "No pr-report- artifact for $HEAD_SHA yet."
            exit 0
          fi

          {
            echo "$marker"
            echo "## PR report"
            echo
            echo "Commit: $HEAD_SHA"
            while IFS=$'\t' read -r _ _ artifact_id; do
              gh api "repos/$REPO/actions/artifacts/$artifact_id/zip" > "$work/$artifact_id.zip"
              echo
              unzip -p "$work/$artifact_id.zip" '*.md' 2> /dev/null | head -c 60000 || true
            done < "$work/artifacts.tsv"
          } > "$work/full.md"
          # A comment body is limited to 65536 characters.
          head -c 60000 "$work/full.md" > "$work/body.md"

          # A push may have come in while the artifacts were collected.
          head=$(gh api "repos/$REPO/pulls/$pr" --jq 'select(.state == "open") | .head.sha')
          if [ "$head" != "$HEAD_SHA" ]; then
            echo "Pull request #$pr no longer has $HEAD_SHA as its head."
            exit 0
          fi

          ids=$(gh api --paginate "repos/$REPO/issues/$pr/comments?per_page=100" \
            --jq '.[] | select(.user.login == "github-actions[bot]" and (.body | startswith("<!-- pr-report -->"))) | .id')
          comment_id=${ids%%$'\n'*}
          payload=$(jq -n --rawfile body "$work/body.md" '{body: $body}')
          if [ -n "$comment_id" ]; then
            gh api --method PATCH "repos/$REPO/issues/comments/$comment_id" --input - <<< "$payload" > /dev/null
          else
            gh api --method POST "repos/$REPO/issues/$pr/comments" --input - <<< "$payload" > /dev/null
          fi
