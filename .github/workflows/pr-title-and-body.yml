name: PR Title and Body

on:
  pull_request:
    types:
      - opened
      - edited
      - synchronize
      - reopened

permissions:
  contents: read

jobs:
  main:
    name: Check Related Documents
    if: github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Write the pull request body to a file
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: printf '%s' "$PR_BODY" > "$RUNNER_TEMP/body.md"
      - name: Check the Related Documents section
        run: bash .claude/skills/plan-completion/scripts/check-pr-body.sh --body-file "$RUNNER_TEMP/body.md"

  language:
    name: Check PR language
    if: github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check PR title and body for Japanese characters
        env:
          TITLE: ${{ github.event.pull_request.title }}
          BODY: ${{ github.event.pull_request.body }}
        shell: python3 {0}
        run: |
          import os
          import re
          import sys

          sys.stdout.reconfigure(encoding="utf-8")

          JAPANESE = re.compile(
              "["
              "\u3000-\u303f"  # CJK symbols and punctuation, including the ideographic space
              "\u3040-\u309f"  # hiragana
              "\u30a0-\u30ff"  # katakana
              "\u31f0-\u31ff"  # katakana phonetic extensions
              "\u3400-\u4dbf"  # CJK unified ideographs extension A
              "\u4e00-\u9fff"  # CJK unified ideographs
              "\uf900-\ufaff"  # CJK compatibility ideographs
              "\uff00-\uffef"  # half-width and full-width forms
              "]"
          )


          def report(location, text):
              found = JAPANESE.findall(text)
              if found:
                  print(f"::error::Japanese characters in PR {location}: {''.join(found)}")
              return bool(found)


          failed = report("title", os.environ.get("TITLE", ""))
          for number, line in enumerate(os.environ.get("BODY", "").split("\n"), start=1):
              if line.endswith("\r"):
                  line = line[:-1]
              if report(f"body line {number}", line):
                  failed = True

          if failed:
              sys.exit(1)
          print("PR title and body contain no Japanese characters.")
