name: CI

on:
  pull_request:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  rspec:
    name: rspec
    runs-on: ubuntu-latest
    container: ruby:4.0.0
    services:
      db:
        image: mysql:8.4.8
        env:
          MYSQL_ROOT_PASSWORD: ci_root_password
          MYSQL_USER: ci_user
          MYSQL_PASSWORD: ci_password
          MYSQL_DATABASE: tascon_test
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -uroot -pci_root_password"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 60
    env:
      RAILS_ENV: test
      TZ: Asia/Tokyo
      CI: "true"
      MYSQL_USER: ci_user
      MYSQL_PASSWORD: ci_password
      MYSQL_DATABASE: tascon_test
      MYSQL_TEST_DATABASE: tascon_test
      WEB_HOST: localhost
      WEB_PORT: "8080"
      RAILS_MASTER_KEY: ${{ secrets.RAILS_MASTER_KEY }}
      COVERAGE: "true"
    steps:
      - name: Install libvips
        run: |
          apt-get update -qq
          apt-get install -y --no-install-recommends libvips42
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/cache@v6
        with:
          path: /usr/local/bundle
          key: gems-ruby-4.0.0-${{ runner.os }}-${{ hashFiles('Gemfile.lock') }}
          restore-keys: gems-ruby-4.0.0-${{ runner.os }}-
      - name: Install gems
        run: bundle install --jobs 4
      - name: Prepare the database
        run: bin/rails db:prepare
      - name: rspec
        run: bin/bundle exec rspec
      - name: Write the coverage report
        continue-on-error: true
        run: |
          ruby -rjson -e '
            line = JSON.parse(File.read("coverage/.last_run.json")).dig("result", "line")
            puts "### Coverage", "", "Line coverage: #{line}%"
          ' > coverage/pr-report.md
      - name: Upload the coverage report
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pr-report-10-coverage
          path: coverage/pr-report.md
          retention-days: 7

  rubocop:
    name: rubocop
    runs-on: ubuntu-latest
    container: ruby:4.0.0
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/cache@v6
        with:
          path: /usr/local/bundle
          key: gems-ruby-4.0.0-${{ runner.os }}-${{ hashFiles('Gemfile.lock') }}
          restore-keys: gems-ruby-4.0.0-${{ runner.os }}-
      - name: Install gems
        run: bundle install --jobs 4
      - name: rubocop
        run: bin/bundle exec rubocop

  htmlbeautifier:
    name: htmlbeautifier
    runs-on: ubuntu-latest
    container: ruby:4.0.0
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Configure git
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - uses: actions/cache@v6
        with:
          path: /usr/local/bundle
          key: gems-ruby-4.0.0-${{ runner.os }}-${{ hashFiles('Gemfile.lock') }}
          restore-keys: gems-ruby-4.0.0-${{ runner.os }}-
      - name: Install gems
        run: bundle install --jobs 4
      - name: htmlbeautifier
        run: |
          mapfile -d '' files < <(git ls-files -z '*.erb')
          bin/bundle exec htmlbeautifier --lint-only "${files[@]}"

  debride:
    name: debride
    runs-on: ubuntu-latest
    container: ruby:4.0.0
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Configure git
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - uses: actions/cache@v6
        with:
          path: /usr/local/bundle
          key: gems-ruby-4.0.0-${{ runner.os }}-${{ hashFiles('Gemfile.lock') }}
          restore-keys: gems-ruby-4.0.0-${{ runner.os }}-
      - name: Install gems
        run: bundle install --jobs 4
      - name: debride
        run: |
          mapfile -d '' files < <(git ls-files -z '*.rb')
          report=$(bin/bundle exec debride --rails -w debride-whitelist.txt "${files[@]}")
          printf '%s\n' "$report"
          grep -q 'Total suspect LOC: 0' <<<"$report"

  check-docs:
    name: check-docs
    runs-on: ubuntu-latest
    container: ruby:4.0.0
    steps:
      - name: Install jq
        run: |
          apt-get update -qq
          apt-get install -y --no-install-recommends jq
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Configure git
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: check-docs.sh
        run: bash .lefthook/pre-commit/check-docs.sh

  pre-commit-check-tests:
    name: pre-commit-check-tests
    runs-on: ubuntu-latest
    container: ruby:4.0.0
    steps:
      - name: Install jq
        run: |
          apt-get update -qq
          apt-get install -y --no-install-recommends jq
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Configure git
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: pre-commit check tests
        run: bash .lefthook/pre-commit/tests/run.sh

  plan-completion-script-tests:
    name: plan-completion-script-tests
    runs-on: ubuntu-latest
    container: ruby:4.0.0
    steps:
      - name: Install jq
        run: |
          apt-get update -qq
          apt-get install -y --no-install-recommends jq
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Configure git
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: plan-completion script tests
        run: bash .claude/skills/plan-completion/scripts/tests/run.sh

  check-plan-completion:
    name: check-plan-completion
    runs-on: ubuntu-latest
    container: ruby:4.0.0
    steps:
      - name: Install jq
        run: |
          apt-get update -qq
          apt-get install -y --no-install-recommends jq
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Configure git
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config --global user.name "CI"
          git config --global user.email "ci@example.invalid"
      - name: check-plan-completion.sh
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          base=$(git merge-base "origin/$BASE_REF" HEAD)
          git reset --soft "$base"
          bash .lefthook/pre-commit/check-plan-completion.sh

  brakeman:
    name: brakeman
    runs-on: ubuntu-latest
    container: ruby:4.0.0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /usr/local/bundle
          key: gems-ruby-4.0.0-${{ runner.os }}-${{ hashFiles('Gemfile.lock') }}
          restore-keys: gems-ruby-4.0.0-${{ runner.os }}-
      - name: Install gems
        run: bundle install --jobs 4
      - name: brakeman
        run: bin/bundle exec brakeman --no-pager

  semgrep:
    name: semgrep
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check out the Semgrep rules
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: semgrep/semgrep-rules
          ref: a5ad1714f00c9f7fde980cab0ea1d6dc6d414fd2
          path: .semgrep-rules
          sparse-checkout: ruby/rails
          persist-credentials: false
      - name: Move the rules out of the workspace
        run: mv .semgrep-rules "$RUNNER_TEMP/semgrep-rules"
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13.18"
      - name: Install Semgrep
        run: python -m pip install --require-hashes -r .github/requirements/semgrep.txt
      - name: semgrep
        run: semgrep scan --config "$RUNNER_TEMP/semgrep-rules/ruby/rails" --metrics=off --error

  checks:
    name: checks
    if: always()
    needs:
      - rspec
      - rubocop
      - htmlbeautifier
      - debride
      - check-docs
      - pre-commit-check-tests
      - plan-completion-script-tests
      - check-plan-completion
      - brakeman
      - semgrep
    runs-on: ubuntu-latest
    steps:
      - name: Fail unless every job succeeded
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          jq -r 'to_entries[] | "\(.key): \(.value.result)"' <<<"$NEEDS"
          jq -e 'all(.[]; .result == "success")' <<<"$NEEDS" > /dev/null
