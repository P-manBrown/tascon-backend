services:
  api:
    volumes:
      - shell-log:/home/${API_USER_NAME}/shell_log
    command: bash -c 'while sleep 1000; do :; done'
    env_file:
      - ./.devcontainer/environment/gh-token.env
    environment:
      CLAUDE_MEM_WORKER_HOST: '0.0.0.0'
      CLAUDE_MEM_WORKER_PORT: '37700'
      CLAUDE_MEM_MODE: 'code--ja'
      CLAUDE_MEM_SKIP_TOOLS: 'ListMcpResourcesTool,SlashCommand,Skill,TodoWrite'
    ports:
      - '127.0.0.1:${CBM_UI_PORT:-9749}:9749'
      - '127.0.0.1:${CLAUDE_MEM_UI_PORT:-37700}:37700'
volumes:
  shell-log:
